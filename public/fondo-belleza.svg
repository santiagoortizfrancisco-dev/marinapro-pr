    <!-- Brillito chico -->
    <path d="M230 220 q2 7 8 8 q-6 1 -8 8 q-2 -7 -8 -8 q6 -1 8 -8 z"/>
    <path d="M150 230 q2 7 8 8 q-6 1 -8 8 q-2 -7 -8 -8 q6 -1 8 -8 z"/>
